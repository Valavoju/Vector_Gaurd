<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VectorGuard AI — Predictive Vector Control Platform</title>
    <meta name="description" content="AI-Powered Predictive Vector Control Platform for proactive vector-breeding prevention and municipal decision support." />
    <meta property="og:title" content="VectorGuard AI — Predictive Vector Control Platform" />
    <meta property="og:description" content="AI-Powered Predictive Vector Control Platform for proactive vector-breeding prevention and municipal decision support." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#e7f0fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Apply the saved / system theme before first paint so there is no flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vg-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
      /* Splash loader: inline so it shows before the JS bundle arrives. */
      #vg-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background:
          radial-gradient(50rem 30rem at 15% 10%, rgba(56,189,248,.30), transparent 60%),
          radial-gradient(40rem 30rem at 90% 90%, rgba(37,99,235,.22), transparent 60%),
          #e7f0fa;
        transition: opacity .6s ease, visibility .6s ease, transform .6s ease;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      }
      html.dark #vg-splash {
        background:
          radial-gradient(44rem 28rem at 50% 42%, rgba(31,111,255,.10), transparent 65%),
          #0e0f12;
      }
      #vg-splash.is-done { opacity: 0; visibility: hidden; transform: scale(1.04); }
      .vg-splash-inner { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      /* The animated mark is the "V" of the wordmark. */
      .vg-splash-brand {
        display: flex; align-items: flex-end; line-height: 1;
        font-family: "Exo 2", "Plus Jakarta Sans", sans-serif; font-weight: 800;
        letter-spacing: .1em; font-size: 38px; color: #0b1430;
      }
      html.dark .vg-splash-brand { color: #f2f2f4; }
      .vg-splash-mark { position: relative; height: 1.32em; width: calc(1.32em * 58 / 51); margin-right: -.05em; margin-bottom: -.02em; }
      .vg-splash-mark svg { width: 100%; height: 100%; overflow: visible; }
      .vg-splash-mark .stroke {
        fill: none; stroke: url(#vgs-b); stroke-width: 1.2; stroke-linejoin: round;
        stroke-dasharray: 220; stroke-dashoffset: 220;
        animation: vgs-draw 1.1s cubic-bezier(.65,0,.35,1) forwards;
      }
      .vg-splash-mark .fill { opacity: 0; animation: vgs-fill .5s .8s ease forwards; }
      .vg-splash-mark .liquid { animation: vgs-rise 1.6s .3s cubic-bezier(.22,1,.36,1) forwards; transform: translateY(64px); }
      .vg-splash-mark .wave { animation: vgs-wave 1.4s linear infinite; }
      .vg-splash-mark::after {
        content: ""; position: absolute; inset: -18px; border-radius: 50%;
        background: radial-gradient(circle, rgba(31,111,255,.35), transparent 65%);
        filter: blur(8px); z-index: -1; animation: vgs-pulse 2.2s ease-in-out infinite;
      }
      .vg-splash-word { display: inline-flex; opacity: 0; animation: vgs-up .6s .45s ease forwards; }
      .vg-splash-word .g {
        margin-left: .32em;
        background: linear-gradient(100deg, #1452f0, #1f8bff 50%, #22c8f5);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .vg-splash-bar {
        width: 168px; height: 4px; border-radius: 99px; overflow: hidden;
        background: rgba(31,111,255,.15); opacity: 0; animation: vgs-up .6s .65s ease forwards;
      }
      .vg-splash-bar i {
        display: block; width: 40%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, #1452f0, #22c8f5);
        animation: vgs-slide 1.1s ease-in-out infinite;
      }
      .vg-splash-sub {
        font-size: 12px; color: #4b5b7c; letter-spacing: .02em;
        opacity: 0; animation: vgs-up .6s .8s ease forwards;
      }
      html.dark .vg-splash-sub { color: #a1a1a8; }
      @keyframes vgs-draw { to { stroke-dashoffset: 0; } }
      @keyframes vgs-fill { to { opacity: 1; } }
      @keyframes vgs-rise { to { transform: translateY(0); } }
      @keyframes vgs-wave { to { transform: translateX(-64px); } }
      @keyframes vgs-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes vgs-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @keyframes vgs-pulse { 0%, 100% { opacity: .6; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.05); } }
      @media (prefers-reduced-motion: reduce) {
        #vg-splash * { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
      }
    </style>
  </head>
  <body class="font-sans antialiased">
    <div id="vg-splash" role="status" aria-live="polite" aria-label="Loading VectorGuard AI">
      <div class="vg-splash-inner">
        <div class="vg-splash-brand" role="img" aria-label="Vector Guard">
        <div class="vg-splash-mark">
          <svg viewBox="3 7 58 51" aria-hidden="true">
            <defs>
              <linearGradient id="vgs-a" x1="6" y1="14" x2="34" y2="58" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#1a4dff"/><stop offset=".55" stop-color="#1463ff"/><stop offset="1" stop-color="#0a1f8f"/>
              </linearGradient>
              <linearGradient id="vgs-b" x1="58" y1="10" x2="30" y2="58" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#22e0f0"/><stop offset=".5" stop-color="#1a8cff"/><stop offset="1" stop-color="#0b3be0"/>
              </linearGradient>
              <clipPath id="vgs-clip">
                <path d="M3 17h13.5l17.2 29.6-4.6 10.4z"/>
                <path d="M29.1 57C45 49.5 55 36 60.5 17.5L43 8.5 24.5 18.5l5.6 11.2 4.6-9.2 4.8-2.6 10.4 3.8C46 33 39.5 45 29.1 57z"/>
              </clipPath>
            </defs>
            <path class="stroke" d="M3 17h13.5l17.2 29.6-4.6 10.4z"/>
            <path class="stroke" d="M29.1 57C45 49.5 55 36 60.5 17.5L43 8.5 24.5 18.5l5.6 11.2 4.6-9.2 4.8-2.6 10.4 3.8C46 33 39.5 45 29.1 57z"/>
            <g clip-path="url(#vgs-clip)">
              <g class="liquid">
                <path class="wave" fill="url(#vgs-b)" d="M0 8 Q8 2 16 8 T32 8 T48 8 T64 8 T80 8 T96 8 T112 8 T128 8 V72 H0Z"/>
              </g>
            </g>
            <g class="fill">
              <path d="M3 17h13.5l17.2 29.6-4.6 10.4z" fill="url(#vgs-a)"/>
              <path d="M29.1 57C45 49.5 55 36 60.5 17.5L43 8.5 24.5 18.5l5.6 11.2 4.6-9.2 4.8-2.6 10.4 3.8C46 33 39.5 45 29.1 57z" fill="url(#vgs-b)"/>
            </g>
          </svg>
        </div>
        <div class="vg-splash-word" aria-hidden="true"><span>ECTOR</span><span class="g">GUARD</span></div>
        </div>
        <div class="vg-splash-bar"><i></i></div>
        <div class="vg-splash-sub">Initialising predictive surveillance…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
